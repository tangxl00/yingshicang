name: iOS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  SCHEME: Yingshicang
  PROJECT: Yingshicang.xcodeproj

jobs:
  # ── U-01 前置门：cheerio.bundle.js 在 macOS JavaScriptCore 上的可证伪探针 ──
  # 依据《iOS 技术架构方案与风险评估》第 9 章：
  #   - U01CheerioProbeTests 放在独立 SPM 包（U01Gate），跑 macOS 不跑模拟器，几十秒出结果
  #   - 五条断言 C-1~C-5 + 最小 Node 垫片对照组，三向分支 A/C/B 的判定数据全部落日志
  gate-u01:
    name: U-01 cheerio gate (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run U01CheerioProbeTests
        run: |
          mkdir -p build-logs
          set -o pipefail
          swift test --package-path U01Gate 2>&1 | tee build-logs/u01-swift-test.log

      - name: Extract U-01 verdict
        if: always()
        run: |
          {
            echo "### U-01 gate summary"
            if grep -q "Test Suite 'All tests' passed" build-logs/u01-swift-test.log 2>/dev/null; then
              echo "**Verdict: A** — 探针全绿（含垫片对照组），维持 JavaScriptCore 原设计"
            elif grep -q "Test Suite 'All tests' failed" build-logs/u01-swift-test.log 2>/dev/null; then
              echo "**Verdict: 见日志** — 存在失败用例，按 C-1~C-5 / 垫片组失败位置对照架构 9.3 判 A/B/C"
            else
              echo "**Verdict: 未知** — 未解析到测试套件结论，读原始日志"
            fi
            grep -E "Test Case .* (passed|failed)|Test Suite '(all tests|U01CheerioProbeTests)" build-logs/u01-swift-test.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-gate-u01
          path: build-logs/
          if-no-files-found: warn

  # ── 主工程单测：模拟器上跑 xcodebuild test，真实输出落日志 ──
  unit-tests:
    name: Unit tests (simulator)
    needs: gate-u01
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          mkdir -p build-logs
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version 2>&1 | tee build-logs/xcodegen-version.log

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee build-logs/xcodegen-generate.log
          test -d Yingshicang.xcodeproj

      - name: Select or create simulator
        run: |
          set -euo pipefail
          {
            echo "### runtimes"
            xcrun simctl list runtimes
            echo "### available iPhone devices"
            xcrun simctl list devices available
          } 2>&1 | tee build-logs/simulator-list.log

          # 质检 P2-8：原实现用 `[.devices[][]] | first` 取「runner 上第一个可用 iPhone」，
          # 命中哪个机型完全取决于 runner 镜像预置了哪些设备（镜像一换就漂移），
          # 而且可能挑到屏幕尺寸/系统版本不同的设备，让布局类断言随镜像变化。
          # 改为固定优先级的确定性选择：按写死的机型名逐个匹配，取第一个真实存在的；
          # 都不存在时才按同一优先级机型 + 最新 iOS runtime 创建。
          # 注意：机型名含空格（"iPhone 16"），必须用 bash 数组 +
          # "${CANDIDATES[@]}" 逐元素遍历；写成 `for name in $CANDIDATES` 会被词拆分
          # 变成 `iPhone` 与 `16` 两个 token，导致永远匹配不到（本轮 CI 实撞）。
          CANDIDATES=("iPhone 16" "iPhone 17" "iPhone 16 Pro" "iPhone 15" "iPhone SE (3rd generation)")
          UDID=""
          for name in "${CANDIDATES[@]}"; do
            UDID=$(xcrun simctl list devices available --json \
              | jq -r --arg n "$name" \
                '[.devices[][] | select(.isAvailable == true) | select(.name == $n)] | first | .udid // empty')
            if [ -n "$UDID" ]; then
              echo "Selected existing simulator: $name ($UDID)"
              break
            fi
          done

          if [ -z "$UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes --json \
              | jq -r '[.runtimes[] | select(.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS")) | select(.isAvailable != false)]
                       | sort_by(.version | split(".") | map(tonumber? // 0)) | last | .identifier')
            if [ -z "$RUNTIME_ID" ] || [ "$RUNTIME_ID" = "null" ]; then
              echo "No available iOS runtime on this runner" >&2
              exit 1
            fi
            for name in "${CANDIDATES[@]}"; do
              DT=$(xcrun simctl list devicetypes --json \
                | jq -r --arg n "$name" '[.devicetypes[] | select(.name == $n)] | first | .identifier // empty')
              if [ -n "$DT" ] && UDID=$(xcrun simctl create "$name" "$DT" "$RUNTIME_ID" 2>/dev/null); then
                echo "Created simulator: $name ($UDID) on $RUNTIME_ID"
                break
              fi
              UDID=""
            done
          fi

          if [ -z "$UDID" ]; then
            echo "Failed to select or create a simulator from the pinned candidate list" >&2
            exit 1
          fi

          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          echo "DEST_ID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator udid=$UDID"

      - name: xcodebuild test
        run: |
          mkdir -p build-logs
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$DEST_ID" \
            -derivedDataPath build/dd \
            2>&1 | tee build-logs/xcodebuild-test.log

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Unit tests summary"
            grep -E "Test Suite '(All tests|.*Tests)' (passed|failed)" build-logs/xcodebuild-test.log | tail -30 || true
            echo "passed cases: $(grep -cE 'Test Case .* passed' build-logs/xcodebuild-test.log || true)"
            echo "failed cases: $(grep -cE 'Test Case .* failed' build-logs/xcodebuild-test.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 质检复验口径（报告 6.3）落到硬门禁：
      #   单元测试总数 ≥26 且真实 passed；0 failed；xcodebuild 自报的汇总行必须存在。
      # 只查 conclusion 会漏掉「测试根本没跑/被跳过」的情形，所以这里直接读日志文本。
      - name: Enforce test evidence gate
        run: |
          set -o pipefail
          LOG=build-logs/xcodebuild-test.log
          [ -f "$LOG" ] || { echo "FAIL: test log missing" >&2; exit 1; }

          PASSED=$(grep -cE "Test Case .* passed" "$LOG" || true)
          FAILED=$(grep -cE "Test Case .* failed" "$LOG" || true)
          echo "passed=$PASSED failed=$FAILED"

          SUMMARY=$(grep -E "Executed \d+ tests?, with \d+ failures?" "$LOG" | tail -5 || true)
          echo "xcodebuild executed summary:"; echo "$SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "FAIL: $FAILED failing test case(s) in log" >&2
            grep -E "Test Case .* failed" "$LOG" | head -20 >&2 || true
            exit 1
          fi
          if [ "$PASSED" -lt 26 ]; then
            echo "FAIL: passed case count $PASSED < 26（质检要求 ≥26 条真实通过）" >&2
            exit 1
          fi
          # 至少要有一条 "Executed N tests" 汇总，证明测试真的执行了而不是被跳过。
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: no 'Executed N tests, with M failures' summary line — 测试可能未真正执行" >&2
            exit 1
          fi

          {
            echo "### Test evidence gate: PASSED"
            echo "- passed cases: $PASSED"
            echo "- failed cases: $FAILED"
            echo "- summary: $SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-unit-tests
          path: build-logs/
          if-no-files-found: warn

  # ── 真机架构构建（免签名）：generic/platform=iOS ──
  build-device:
    name: Device build (unsigned)
    needs: unit-tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          mkdir -p build-logs
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version 2>&1 | tee build-logs/xcodegen-version.log

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee build-logs/xcodegen-generate.log
          test -d Yingshicang.xcodeproj

      - name: xcodebuild build (generic iOS, signing disabled)
        run: |
          mkdir -p build-logs
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-logs/xcodebuild-device-build.log

      - name: Verify Release optimization level is -O
        run: |
          mkdir -p build-logs
          set -o pipefail
          xcodebuild -showBuildSettings \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            2>/dev/null | tee build-logs/release-build-settings.log \
            | grep -E "SWIFT_OPTIMIZATION_LEVEL|SWIFT_COMPILATION_MODE|CONFIGURATION = " || true

          OPT=$(xcodebuild -showBuildSettings \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' 2>/dev/null \
            | awk -F' = ' '/SWIFT_OPTIMIZATION_LEVEL/{print $2; exit}' | tr -d ' ')
          echo "Release SWIFT_OPTIMIZATION_LEVEL=$OPT"
          if [ "$OPT" != "-O" ]; then
            echo "FAIL: Release 优化级别应为 -O，实际 '$OPT'（质检 P2-1 未修复）" >&2
            exit 1
          fi

          # 旁证：编译日志里 app target 不应再出现 -Onone。
          ONONE=$(grep -c -- "-Onone" build-logs/xcodebuild-device-build.log || true)
          echo "occurrences of -Onone in device build log: $ONONE"
          {
            echo "### Release optimization"
            echo "- SWIFT_OPTIMIZATION_LEVEL: **$OPT**"
            echo "- \`-Onone\` occurrences in build log: $ONONE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect unsigned .app
        run: |
          set -euo pipefail
          APP_DIR="build/dd/Build/Products/Release-iphoneos"
          if [ ! -d "$APP_DIR/Yingshicang.app" ]; then
            echo "Yingshicang.app not found under $APP_DIR" >&2
            find build/dd/Build/Products -maxdepth 2 -type d || true
            exit 1
          fi
          mkdir -p unsigned-app
          cp -R "$APP_DIR/Yingshicang.app" unsigned-app/
          du -sh unsigned-app/Yingshicang.app

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: unsigned-app/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-build-device
          path: build-logs/
          if-no-files-found: warn

  # ── 免签 IPA：Payload 布局正确、嵌套完整、不含 embedded.mobileprovision ──
  package-ipa:
    name: Package unsigned IPA
    needs: build-device
    runs-on: macos-15
    steps:
      - name: Download unsigned app
        uses: actions/download-artifact@v4
        with:
          name: unsigned-app
          path: unsigned-app/

      - name: Wrap into Payload and verify
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R unsigned-app/Yingshicang.app Payload/
          APP=Payload/Yingshicang.app
          # 架构 9.7：免签口径 = 结构完整、可被工具重签、不带 embedded.mobileprovision
          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "FAIL: embedded.mobileprovision present in unsigned IPA" >&2
            exit 1
          fi

          # ── 结构断言（质检复验口径，写成硬门禁而不是人工看图） ──
          # 1. 主二进制必须是单一自包含可执行文件：Xcode 16 无签名 Release 默认会产出
          #    `Yingshicang.debug.dylib` stub，主二进制只有几十 KB，真代码在 dylib 里；
          #    project.yml 已置 ENABLE_DEBUG_DYLIB: NO，这里断言它真的没回来。
          BIN="$APP/Yingshicang"
          [ -f "$BIN" ] || { echo "FAIL: main binary missing at $BIN" >&2; exit 1; }
          BIN_SIZE=$(stat -f%z "$BIN")
          echo "main binary size: $BIN_SIZE bytes"
          if [ "$BIN_SIZE" -lt 1000000 ]; then
            echo "FAIL: 主二进制仅 $BIN_SIZE 字节，疑似 debug-dylib stub（ENABLE_DEBUG_DYLIB 未生效）" >&2
            exit 1
          fi
          for stub in "$APP/Yingshicang.debug.dylib" "$APP/__preview.dylib"; do
            if [ -e "$stub" ]; then
              echo "FAIL: unexpected dylib stub present: $stub" >&2
              exit 1
            fi
          done

          # 2. 架构必须是 arm64（源码 UIRequiredDeviceCapabilities 已声明 arm64）。
          ARCHS=$(lipo -info "$BIN" 2>&1 || true)
          echo "lipo: $ARCHS"
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "FAIL: main binary is not arm64: $ARCHS" >&2; exit 1 ;;
          esac
          case "$ARCHS" in
            *armv7*|*i386*|*x86_64*) echo "FAIL: unexpected slice in main binary: $ARCHS" >&2; exit 1 ;;
          esac

          # 3. Info.plist 关键值与源码声明一致。
          PLIST="$APP/Info.plist"
          [ -f "$PLIST" ] || { echo "FAIL: Info.plist missing" >&2; exit 1; }
          echo "--- Info.plist assertions ---"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion \
                     UIDeviceFamily UIBackgroundModes NSAppTransportSecurity; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null || echo "<absent>")
            echo "$key = $value"
          done

          # 4. Frameworks 目录：本工程 SPM 依赖静态链接，不应有 Frameworks。
          #    有则打印出来（不是失败），因为「有没有」要和 IMPLEMENTATION_STATUS 的措辞对齐。
          if [ -d "$APP/Frameworks" ]; then
            echo "Frameworks dir present:"; ls -1 "$APP/Frameworks"
          else
            echo "(no Frameworks dir — SPM deps statically linked, matches IMPLEMENTATION_STATUS)"
          fi

          IPA="Yingshicang-2.0.50-unsigned.ipa"
          zip -qry "$IPA" Payload
          # 结构验证：主二进制与 Info.plist 必须在 Payload/*.app 下
          unzip -l "$IPA" | grep -E "Payload/Yingshicang.app/(Yingshicang|Info.plist)$"
          echo "IPA size: $(du -h "$IPA" | cut -f1)"
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: Yingshicang-2.0.50-unsigned.ipa
          if-no-files-found: error

  # ── 汇总交付：IPA + 全部 build-logs 合并为一个 release bundle ──
  upload-artifacts:
    name: Upload release bundle
    needs: package-ipa
    runs-on: macos-15
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: unsigned-ipa
          path: dist/

      - name: Download all build logs
        uses: actions/download-artifact@v4
        with:
          pattern: build-logs-*
          path: dist/build-logs/
          merge-multiple: true

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: yingshicang-release-bundle
          path: dist/
          if-no-files-found: error
