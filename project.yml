name: Yingshicang
options:
  bundleIdPrefix: com.yingshicang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: "2.0.50"
    CURRENT_PROJECT_VERSION: "25"
    # 产物实测 UIDeviceFamily = [1,2]（iPhone + iPad），源码声明必须与产物一致（质检 P2）。
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    # 不把 -Onone 放在 base：放在 base 会让 Release 也不优化（device-build 日志实证 app 模块 5 处 -Onone，
    # 而 SPM 依赖是 -O）。优化级别只在 Debug 关掉，Release 走 Xcode 默认 -O（质检 P2-1）。

configs:
  Debug: debug
  Release: release

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.12.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.14.3"
  # F-09 双内核：VLCKit 4.0 官方 SPM 包。包体只有一个 binaryTarget，
  # 产物 VLCKit.xcframework 含 ios-arm64（设备）与 simulator 两个切片。
  # pin 到 tag 4.0.0-a25：该 tag 的 Package.swift 里 binaryTarget 的 url/checksum
  # 与 master 一致（checksum f37c8dbd…2f1fb），固定版本避免上游随时换制品。
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    exactVersion: "4.0.0-a25"

targets:
  Yingshicang:
    type: application
    platform: iOS
    sources:
      - path: Yingshicang
        excludes:
          - "Resources/Rules/**"
          - "Resources/Assets.xcassets/**"
      - path: Yingshicang/Resources/Rules
        type: folder
        buildPhase: resources
      - path: Yingshicang/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingshicang.ios
        PRODUCT_NAME: Yingshicang
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: NO
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: GRDB
        product: GRDB
      - package: SwiftSoup
        product: SwiftSoup
      # F-09：VLCKit 是动态 framework 依赖（nested framework 嵌入 Frameworks/）。
      - package: VLCKit
        product: VLCKit

  YingshicangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          # fixture 是真实配置样本（含二进制体），按 folder reference 原样拷进测试 bundle，
          # 不作为源码参与编译；Build25ConfigFormatRegressionTests 用 subdirectory: "Fixtures" 读取。
          - "Fixtures/**"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingshicang.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yingshicang.app/Yingshicang"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Yingshicang

schemes:
  Yingshicang:
    build:
      targets:
        Yingshicang: all
        YingshicangTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - YingshicangTests
    run:
      config: Debug
    archive:
      config: Release
