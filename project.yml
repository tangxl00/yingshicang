name: Yingshicang
options:
  bundleIdPrefix: com.yingshicang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: "2.0.50"
    CURRENT_PROJECT_VERSION: "20"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.12.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.14.3"

targets:
  Yingshicang:
    type: application
    platform: iOS
    sources:
      - path: Yingshicang
        excludes:
          - "Resources/Rules/**"
          - "Resources/Assets.xcassets/**"
      - path: Yingshicang/Resources/Rules
        type: folder
        buildPhase: resources
      - path: Yingshicang/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingshicang.ios
        PRODUCT_NAME: Yingshicang
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: GRDB
        product: GRDB
      - package: SwiftSoup
        product: SwiftSoup

  YingshicangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingshicang.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yingshicang.app/Yingshicang"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Yingshicang

schemes:
  Yingshicang:
    build:
      targets:
        Yingshicang: all
        YingshicangTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - YingshicangTests
    run:
      config: Debug
    archive:
      config: Release
